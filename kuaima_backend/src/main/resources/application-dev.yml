# 阿里云短信（密钥通过环境变量注入，请勿硬编码）
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: 快马日结
    template-code: SMS_470990050
    # 开发环境使用固定验证码，生产环境配置必须保持 false
    mock-enabled: true
    mock-code: "000000"
    # 固定验证码模式下允许 App 短信登录的测试手机号（逗号分隔）；留空则拒绝所有短信登录。
    # 固定验证码等于知道手机号就能登录，严禁填写真实用户手机号。
    mock-login-phones: ${KUAIMA_SMS_MOCK_LOGIN_PHONES:}
    # 验证码有效期（秒）
    code-expiration: 300
    # 重发间隔限制（秒）
    resend-interval: 60

# SpringDoc OpenAPI / Swagger 文档配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
