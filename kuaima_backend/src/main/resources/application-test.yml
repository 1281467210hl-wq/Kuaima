spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/kuaima?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: 11112222
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true


jwt:
  secret: 7sK9dP2qR5zX8bN4vG1tL6cW3jF0hY7mA9sD2fJ5kQ8pZ1xV4bN7gT0lC3rH6jM9wS2dF5
  # access token 有效期（毫秒），3 天
  expiration: 259200000

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_APP_SECRET:}

# 阿里云短信（测试环境使用 mock 模式）
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: 快马日结
    template-code: SMS_470990050
    mock-enabled: true
    mock-code: "000000"
    # 固定验证码模式下允许 App 短信登录的测试手机号（逗号分隔）；留空则拒绝所有短信登录。
    # 固定验证码等于知道手机号就能登录，严禁填写真实用户手机号。
    mock-login-phones: ${KUAIMA_SMS_MOCK_LOGIN_PHONES:}
    code-expiration: 300
    resend-interval: 60

# SpringDoc OpenAPI / Swagger 文档配置
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui/index.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
    display-request-duration: true
