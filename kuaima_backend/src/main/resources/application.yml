server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true

spring:
  application:
    name: kuaima
  profiles:
    # 切换环境：dev | test
    active: dev
  servlet:
    multipart:
      # 学堂视频最大 200MB；请求上限略高以容纳 multipart 边界和表单字段。
      max-file-size: 200MB
      max-request-size: 210MB
  config:
    import: optional:file:.config/kuaima/oss.env[.properties]


kuaima:
  reward:
    # 默认不以平台预存余额拦截奖励发放；仍保留支出流水和余额记账。
    fund-control-enabled: ${KUAIMA_REWARD_FUND_CONTROL_ENABLED:false}
  media:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    transcode-timeout-seconds: ${VIDEO_TRANSCODE_TIMEOUT_SECONDS:900}
    public-base-url: ${KUAIMA_MEDIA_PUBLIC_BASE_URL:}
    proxy-url-expiration-seconds: ${KUAIMA_MEDIA_PROXY_URL_EXPIRATION_SECONDS:3600}
  settle:
    # 平台服务费率(% of 工资)，规则待定，默认 0 即暂不收取
    service-fee-rate: 0

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    domain: ${ALIYUN_OSS_DOMAIN:}
    signed-url-expiration-seconds: ${ALIYUN_OSS_SIGNED_URL_EXPIRATION_SECONDS:3600}
  face:
    endpoint: ${ALIYUN_FACE_ENDPOINT:facebody.cn-hangzhou.aliyuncs.com}
    access-key-id: ${ALIYUN_FACE_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_FACE_ACCESS_KEY_SECRET:}

location:
  amap:
    web-service-key: ${AMAP_WEB_SERVICE_KEY:}

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  withdraw-enabled: ${ALIPAY_WITHDRAW_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
  private-key: ${ALIPAY_APP_PRIVATE_KEY:}
  private-key-path: ${ALIPAY_APP_PRIVATE_KEY_PATH:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  app-cert-path: ${ALIPAY_APP_CERT_PATH:}
  alipay-public-cert-path: ${ALIPAY_ALIPAY_CERT_PATH:}
  root-cert-path: ${ALIPAY_ROOT_CERT_PATH:}
  sign-type: ${ALIPAY_SIGN_TYPE:RSA2}

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_APP_SECRET:}
  mock-enabled: false
  pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    mchid: ${WECHAT_PAY_MCHID:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    cert-serial-no: ${WECHAT_PAY_CERT_SERIAL_NO:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    platform-public-key-path: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:}
    platform-public-key-id: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_ID:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://ke.taifang.xyz/api/pay/wechat/notify}
    transfer-scene-id: ${WECHAT_PAY_TRANSFER_SCENE_ID:1000}
    transfer-scene-report-infos[0].info-type: ${WECHAT_PAY_TRANSFER_SCENE_INFO_TYPE_0:活动名称}
    transfer-scene-report-infos[0].info-content: ${WECHAT_PAY_TRANSFER_SCENE_INFO_CONTENT_0:快马日结奖励活动}
    transfer-scene-report-infos[1].info-type: ${WECHAT_PAY_TRANSFER_SCENE_INFO_TYPE_1:奖励说明}
    transfer-scene-report-infos[1].info-content: ${WECHAT_PAY_TRANSFER_SCENE_INFO_CONTENT_1:平台奖励提现}
    transfer-notify-url: ${WECHAT_PAY_TRANSFER_NOTIFY_URL:}

jobs:
  message:
    cron: "0 * * * * ?"
  credit:
    daily-cron: "0 0 2 * * ?"
    monthly-cron: "0 0 3 1 * ?"
    # 规则生效前的历史订单不追溯计算；发布到新环境时按实际上线时间调整。
    effective-from: "2026-09-19T00:00:00"
  reward-withdraw:
    sync-initial-delay: 60000
    sync-fixed-delay: 60000
  wallet-withdraw:
    sync-initial-delay: 60000
    sync-fixed-delay: 60000
